version: '3.8'

services:
  geoserver-fips:
    build:
      context: .
      dockerfile: Dockerfile.fips
    container_name: geoserver-fips
    ports:
      - "8080:8080"
    environment:
      - FIPS_MODE=true
      - GEOSERVER_KEYSTORE_TYPE=PKCS12
      - JAVA_OPTS=-Dcom.redhat.fips=true -Xmx2g -Xms1g
    volumes:
      - ./data:/opt/geoserver/data_dir
      - ./logs:/opt/geoserver/logs
      - ./security:/opt/geoserver/security
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Add a database for testing
  postgres-fips:
    image: postgres:13
    container_name: postgres-fips
    environment:
      POSTGRES_DB: geoserver
      POSTGRES_USER: geoserver
      POSTGRES_PASSWORD: geoserver
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: 